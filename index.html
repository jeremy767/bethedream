  areas: {
    /* ---------------- HBCU LEGACY ---------------- */
    "hbcu-legacy/partnership": { title: "Establish the HBCU Partnership", label: "Area 1", sub: "Foundation · Shared Purpose",
      card: "Define the shared foundation before scholars arrive. Clarify what HBCU affiliation means for your school, not just symbolically, but structurally.",
      intro: "Align institutions on shared purpose and non-negotiables before scholars ever walk in the door.",
      slotId: "pb-hbcu-partnership", watchFor: "Watch for how partnership expectations are communicated to staff and how HBCU identity shows up in school spaces.",
      strong: ["Shared MOU with explicit roles, expectations, and decision-making authority across institutions", "HBCU presence is structural (faculty, students, physical spaces, and language), not just branding", "Leaders at both institutions have aligned on what “HBCU-inspired” means in practice", "Capacity limits and resource needs are surfaced early, not discovered mid-year"],
      breakdowns: ["Symbolic HBCU affiliation without substantive integration into daily school life", "No clear decision-making structure when conflicts arise between institutions", "Partnership built on personal relationships rather than institutional agreements", "HBCU partner treated as a vendor rather than a co-designer of the experience"],
      learned: ["Start with the non-negotiables on both sides. Surface them early rather than discovering them in conflict.", "Durability requires institutional structures, not just personal champions.", "The partnership agreement should evolve annually as both institutions learn what is working."],
      relatedLessons: ["can-and-cannot", "structures-not-people", "mission-clarity"],
      reflect: ["Does our HBCU partnership live in a document, or in the daily life of the school?", "What would happen to this partnership if one key person on either side left?", "How does our HBCU partner show up as a co-designer, not just a credentialing body?"] },

    "hbcu-legacy/culture": { photo: "culture", title: "Build an Identity-Centered Culture System", label: "Area 2", sub: "Rituals · Belonging · Norms",
      card: "Design rituals and traditions that make HBCU identity visible, felt, and owned by scholars, not performed for them.",
      intro: "Rituals and norms that make HBCU belonging real, not performed.",
      slotId: "pb-hbcu-culture", slotDesc: "Culture in action: assembly moments, Morning Call and Response, House Huddles, HBCU Fridays, Mentorship Mondays. What HBCU culture looks and feels like when it is fully alive in a school building.",
      watchFor: "Observe how adults coordinate to bridge high school and university culture, and how daily rituals are facilitating scholar identity development.",
      strong: ["House System with HBCU-inspired naming that scholars genuinely own", "Daily rituals: Morning Call and Response, House Huddles, Leadership Spotlights", "Weekly anchors: HBCU Fridays, Mentorship Mondays, Wellness Wednesdays", "Adults model college-going behavior and HBCU identity, not just instruct it", "Visible HBCU presence in school spaces, language, and adult relationships"],
      breakdowns: ["Rituals become routine without meaning: scholars participate but do not connect", "HBCU culture is treated as an event (Black History Month), not a daily practice", "Adults unsure how to bridge high school and university cultural norms", "Scholars treated as “different” for being in an early college program instead of prepared"],
      learned: ["The best rituals are co-created with scholars. They become owned, not performed.", "P.O.W.E.R. values (Purpose-Driven Excellence, Ownership, Worldview, Engaged Citizenship, Relationships) give culture a backbone that anchors every ritual to something larger.", "Culture needs a champion who shows up consistently. It cannot be distributed equally across all staff without intentional coordination."],
      relatedLessons: ["culture-scholars-own"],
      reflectDrafted: true,
      reflect: ["Which of our rituals did scholars help create, and which are performed for them?", "Who is the champion adults coordinate culture around?", "Where does HBCU identity show up on an ordinary Tuesday?"] },

    "hbcu-legacy/opportunities": { photo: "voices", title: "Expansive Opportunities", label: "Area 3", sub: "Success Coaching · Visits · Internships · Community",
      card: "A connected ecosystem of opportunities (success coaching, campus visits, internships, mentorships, and community partnerships) designed to stack and compound over time.",
      intro: "A connected ecosystem of five pathways, not a menu of isolated events. These opportunities are designed to stack and compound over time, expanding every scholar’s sense of what is possible for themselves and their community.",
      slotId: "pb-opportunities", slotDesc: "Scholars speaking about the full arc of their opportunity experience, from coaching to campus visits to internships, and how each one built on the last to expand who they see themselves becoming.",
      ecosystem: { t: "Ecosystem Over Menu", d: "Each pathway is designed to connect to the others. Success coaching builds the self-awareness scholars bring to campus visits. Campus visits deepen the aspiration that drives their engagement in internships. Community partnerships ground their professional experiences in purpose. When these five pathways are coordinated as a system, they compound, and scholars feel it." },
      pathways: [
        { slug: "success-coaching", n: 1, t: "Success Coaching", sub: "Identity · Navigation · Self-Advocacy", d: "Relational coaching that develops scholars as whole people, building self-advocacy, academic confidence, and a grounded sense of college-going identity.", looks: ["Weekly check-ins focused on belonging as much as academics", "Coaches trained in identity-centered advising", "Coordinated between high school and DSU advisors"] },
        { slug: "campus-visits", n: 2, t: "Campus Visits", sub: "Belonging · Familiarity · College Identity", d: "Multi-campus HBCU visits (Howard, Morgan State, Virginia State, Delaware State) designed to build authentic belonging, not tourism.", looks: ["Pre- and post-visit reflection built into the experience", "Interaction with current HBCU students and faculty", "Career Immersion Days on campus at DSU"] },
        { slug: "internships", n: 3, t: "Internships and Mentorships", sub: "Career · Professional Identity · Real Impact", d: "Scaffolded professional experiences aligned to coursework and scholar interests, with HBCU alumni mentors who bring lived context to the relationship.", looks: ["Minimum 54 work-based learning hours per scholar", "Structured mentorship, not informal networking", "Access to DSU career center resources"] },
        { slug: "community", n: 4, t: "Community Partnerships", sub: "Leadership · Contribution · Southeast Queens", d: "Scholars positioned as contributors and problem-solvers, designing and implementing real solutions to real challenges in their community.", looks: ["Leadership Studios anchored in the DEEDS learning cycle", "Durable agreements with community organizations", "Scholars as co-designers, not service recipients"] },
        { slug: "ghana", n: 5, t: "Global and Cultural Immersion", sub: "Diaspora · Heritage · Global Identity", d: "Transformative experiences, including the Ghana cultural immersion trip, that connect scholars’ HBCU identity to the African diaspora and a sense of global belonging.", looks: ["February Spring Break Ghana cultural immersion (Year 1)", "Structured pre- and post-trip reflection curriculum", "Connection to Pan-African history and HBCU legacy"] }
      ],
      principles: { t: "Design Principles for Expansive Opportunities", d: "Strong partnerships ensure these pathways are <strong>visible to all scholars</strong>, not dependent on who you know or insider knowledge. They are <strong>accessible regardless of GPA</strong>, designed to <strong>stack and compound</strong> across the four years, and built around <strong>identity affirmation</strong>, not assimilation. When all five pathways are running together as a coordinated ecosystem, scholars graduate with more than credentials. They graduate with a sense of who they are in the world." },
      relatedLessons: ["opportunity-ecosystem"],
      reflectDrafted: true,
      reflect: ["Is every pathway visible to every scholar, regardless of GPA?", "How does each pathway connect to the next one a scholar will experience?", "Which pathway is weakest in our ecosystem right now?"] },

    "hbcu-legacy/success-coaching": { parent: "hbcu-legacy/opportunities", title: "Success Coaching", label: "Pathway 1", sub: "Identity · Navigation · Self-Advocacy",
      intro: "Coaching that fosters self-advocacy and effective functioning as scholars navigate the shift to college-level identity and expectations.",
      slotId: "pb-coaching", slotDesc: "What identity-centered advising looks and sounds like when it is working, and how coaching helps scholars navigate both academic and personal challenges.",
      watchFor: "Watch coaching that balances academic support with identity development and college navigation.",
      strong: ["Coaches trained in identity-centered advising, not just academic scheduling", "Weekly advisory sessions with culturally responsive curriculum", "Regular check-ins focused on both academic expectations and sense of belonging", "Coordinated expectations between high school advisors and university supports"],
      breakdowns: ["Coaching treated as remediation rather than developmental support", "Conversations become transactional rather than relational", "No coordination between high school advisors and university partners"],
      learned: ["The best coaching conversations happen around identity: who scholars are becoming, not just how they are performing.", "When coaching is relational, scholars bring the hard questions, not just the scheduling ones."],
      relatedLessons: ["meet-scholars-where-they-are", "load-on-14-year-olds"],
      reflectDrafted: true,
      reflect: ["Do our coaches know where each scholar came from, whether this school was their choice, and what their goals are?", "Are coaching conversations relational or transactional right now?"] },

    "hbcu-legacy/campus-visits": { parent: "hbcu-legacy/opportunities", title: "Campus Visits", label: "Pathway 2", sub: "Belonging · Familiarity · College Identity",
      intro: "Visits designed to build authentic belonging, not tourism. Scholars leave as active participants, not observers.",
      slotId: "pb-campus", slotDesc: "Scholars on HBCU campuses, interacting with current HBCU students, and reflecting afterward on what shifted for them.",
      strong: ["Pre- and post-visit reflection built into the experience design", "Interaction with current HBCU students and faculty, not just admissions staff", "Multiple touchpoints across high school years that build familiarity progressively", "Access to labs, studios, career centers, and real academic spaces", "Career Immersion Days that connect the campus to professional pathways"],
      breakdowns: ["One-off events without intentional follow-up or progression", "Performative visits focused on photo opportunities rather than scholar learning", "No structured reflection connecting the visit to academic or career pathways", "Visits designed for institutional marketing rather than scholar development"],
      learned: ["Scholars need to see themselves in the spaces they are visiting, not just observe them.", "Peer interaction with current HBCU students is more powerful than any admissions presentation.", "The reflection conversation after the visit often matters more than the visit itself."],
      relatedLessons: ["opportunity-ecosystem"],
      reflectDrafted: true,
      reflect: ["What do scholars do before and after a visit to make it last?", "Where do scholars meet current HBCU students, not just admissions staff?"] },

    "hbcu-legacy/internships": { parent: "hbcu-legacy/opportunities", title: "Internships and Mentorships", label: "Pathway 3", sub: "Career · Professional Identity · Real Impact",
      intro: "Scaffolded professional experiences that connect what scholars are learning to what they are becoming.",
      slotId: "pb-internships", slotDesc: "Scholars on what they worked on, who they worked with, and how it connected to their coursework and professional identity, plus HBCU alumni mentors on why they give back.",
      strong: ["Experiences aligned to scholar interests and current coursework", "Structured mentorship with clear expectations, not informal networking", "HBCU alumni mentors who provide guidance and professional network access", "Minimum 54 work-based learning hours embedded in program design", "Access to DSU career center resources while still in high school"],
      breakdowns: ["Opportunities limited to high-achieving scholars rather than accessible to all", "Treated as resume-building rather than identity development", "Dependent on personal relationships rather than institutional structures", "Disconnected from what scholars are learning in their courses"],
      learned: ["The best mentors are not just professionally accomplished. They understand the HBCU experience.", "When internship experiences connect directly to coursework, scholars report deeper learning in both settings."],
      relatedLessons: ["opportunity-ecosystem"],
      reflectDrafted: true,
      reflect: ["Can every scholar reach an internship or mentorship, or only a few?", "How does each placement connect back to coursework?"] },

    "hbcu-legacy/community": { parent: "hbcu-legacy/opportunities", title: "Community Partnerships", label: "Pathway 4", sub: "Leadership · Contribution · Southeast Queens",
      intro: "Learning that is additive, not extractive. Scholars as contributors and leaders in Southeast Queens.",
      slotId: "pb-community", slotDesc: "Scholars bringing community action projects to neighborhood stakeholders, and community partners on what the relationship means to them.",
      strong: ["Systems-based, durable agreements with community organizations", "Opportunities designed with community input, not imposed from the school", "Scholars positioned as contributors creating meaningful change in Southeast Queens", "Leadership Studios structured around identifying and solving real community challenges", "DEEDS learning cycle anchors every project"],
      breakdowns: ["Partnerships rely on personal relationships rather than institutional structures", "Extractive partnerships that benefit the school more than the community", "Transactional design: service events rather than sustained relationships", "Scholars positioned as recipients rather than contributors"],
      learned: ["Community partners who co-design the experience are more invested in scholar success.", "The shift from “service project” to “community leadership” changes how scholars show up.", "Durability requires written agreements and clear roles."],
      relatedLessons: ["real-stakes"],

    "hbcu-legacy/ghana": { parent: "hbcu-legacy/opportunities", title: "Global and Cultural Immersion", label: "Pathway 5", sub: "Diaspora · Heritage · Global Identity",
      intro: "Connecting scholars’ HBCU identity to the African diaspora, building a sense of global belonging, historical pride, and personal purpose that no classroom experience alone can create.",
      slotId: "pb-ghana", slotDesc: "The Ghana trip: learning the language, standing in the slave dungeons, and a book and school supply drive for a Ghanaian school. Scholar reflections on what shifted still to be recorded.",
      strong: ["Pre-trip curriculum that grounds scholars in Pan-African history and the HBCU legacy before they arrive", "Structured daily reflection throughout the trip, not just photos and memories", "Explicit connection to what scholars are studying in their academic courses", "Post-trip integration: scholars bring what they experienced back into their DEEDS work and community projects", "All scholars have access. The experience is not reserved for top performers.", "Faculty or staff chaperones who can facilitate academic and identity reflection in real time"],
      breakdowns: ["Trip treated as a reward rather than a designed learning experience", "No structured reflection: scholars return inspired but without language for what they experienced", "Disconnected from academic coursework, living only as a memory rather than a catalyst", "Logistics-only planning with no curriculum framework built around the experience", "Access limited by cost without proactive fundraising or financial support structures"],
      learned: ["Scholars who had the strongest pre-trip grounding in Pan-African history were the most articulate about what they experienced, and the most transformed by it.", "The post-trip integration into DEEDS projects is where the learning becomes lasting. The trip plants the seed; the project lets it grow.", { text: "Caregivers reported some of the most significant changes they had seen in their scholars after this experience. It belongs in the playbook as a core opportunity, not a one-off.", pending: true }],
      relatedLessons: ["opportunity-ecosystem"],
      reflect: ["How do we design the experience so every scholar, regardless of prior knowledge, arrives prepared to receive it?", "What is the explicit academic and identity connection we are building into this trip?", "How do we ensure scholars bring what they experienced back into their schoolwork and community, not just their Instagram?", "How do we make this financially accessible to all scholars?"] },

    /* ---------------- EARLY COLLEGE ---------------- */
    "early-college/partnership": { title: "Establish the University Partnership", label: "Step 1", sub: "MOU · Roles · Alignment",
      card: "Build the cross-system foundation, aligned on purpose, decision authority, and what each institution is responsible for.",
      intro: "Align institutions on shared purpose, decision authority, and what each side is responsible for, before scholars enter the picture.",
      slotId: "pb-ec-partnership", slotDesc: "University and district leaders on what it took to build this partnership and what the MOU had to get right.",
      strong: ["Formal MOU with explicit roles, credit transfer agreements, and escalation paths", "Clear understanding of decision authority vs. execution responsibility on both sides", "Non-negotiables surfaced and agreed to before the partnership is announced publicly", "Regular cross-system leadership check-ins built into the operating calendar", "Both institutions treat each other as co-designers, not as vendor and client"],
      breakdowns: ["Partnership built on personal relationships, not institutional structures that survive staff changes", "Capacity limits not surfaced early, leading to under-delivery mid-year", "Ambiguous decision authority creates delays when issues arise", "University is treated as a credential provider rather than a cultural partner"],
      learned: ["The partnership agreement must be revisited annually. What works in Year 1 will need refinement in Year 2.", "Leadership from both institutions needs to be visible to scholars, not just names on an MOU.", "Transparency about what each institution can and cannot do builds more trust than over-promising."],
      relatedLessons: ["structures-not-people", "can-and-cannot"],
      reflect: ["If a key leader on either side left tomorrow, would this partnership survive?", "Do both institutions have the same understanding of what this partnership is supposed to produce for scholars?", "Where are the places where decision-making authority is unclear, and what happens when those moments arise?"] },

    "early-college/experience": { photo: "appdesign", title: "Define the Student Experience", label: "Step 2", sub: "Courses · Credit · Advising",
      card: "Decide on the course menu, credit transfer agreements, and the advising structures that help scholars navigate both systems.",
      intro: "Decide on what scholars take, how credit transfers, and how advising supports them through both systems.",
      slotId: "pb-ec-experience", slotDesc: "Scholars on what it feels like to take college-level courses in high school (what is hard, what is meaningful, what they did not expect), paired with teachers on coordinating with university faculty.",
      watchFor: "Watch for how instructional decisions reflect shared academic expectations and how faculty from both institutions coordinate around scholar success.",
      strong: ["Clear articulation agreements: credits are designed to transfer, not just appear to", "Course menu aligned to scholar goals and institutional capacity, not just what is convenient", "Advising that attends to both academic progress and identity development as a college-going scholar", "Scholars have access to university resources: labs, career centers, faculty mentors, and campus life", "High school and university faculty communicate regularly about scholar progress and expectations"],
      breakdowns: ["Non-transferable credits that undermine scholar progress and erode trust in the program", "Course menu designed for institutional convenience rather than scholar learning goals", "Advising that becomes transactional (“fix my schedule”) rather than developmental", "Mismatched expectations between high school and university faculty that reach scholars as confusion"],
      learned: ["Scholars thrive when they understand why they are taking each course, not just that it counts toward a degree.", "Credit transfer clarity must be communicated to families, not just scholars and staff.", "The best advising conversations happen around identity and belonging, not just scheduling."],
      relatedLessons: ["fix-the-plumbing", "load-on-14-year-olds"],

    "early-college/reflection": { title: "Build in Reflection and Improvement", label: "Step 3", sub: "Data · Feedback · Iteration",
      card: "Create structured loops for learning while doing, not after it is over. Continuous improvement is a design feature, not an afterthought.",
      intro: "Learn while doing, not after it is over.",
      slotId: "pb-ec-reflection", slotDesc: "A real midpoint debrief between school leadership and DSU partners: what the data is showing, what needs to change, and how both institutions are adjusting together.",
      watchFor: "Observe how midpoint feedback conversations happen, how data is presented to stakeholders, and how reflection informs adjustments to the program.",
      strong: ["Structured feedback loops between scholars, families, staff, and university partners", "Data collected regularly and used to make real decisions, not just reported upward", "Midpoint check-ins built into the program calendar so issues surface before year-end", "Both institutions participate in reflection, not just the high school", "Partnership evolves each year based on what is learned"],
      breakdowns: ["Feedback collected but not acted on, which erodes trust over time", "Reflection happens only at year-end, when it is too late to course-correct", "Only one institution takes responsibility for learning from the partnership", "Data collection becomes a compliance exercise rather than a learning tool"],
      learned: ["The partnerships that improve fastest are the ones that build reflection into the operating rhythm, not as an add-on event.", "Midpoint check-ins are more valuable than end-of-year surveys. They leave time to actually change something.", "Progress measures that matter: MAP Growth, college credits earned, performance-based assessments, community action projects, and work-based learning hours."],
      relatedLessons: ["midpoint-reflection", "outside-team-recedes"],
      reflectDrafted: true,
      reflect: ["When is our midpoint check-in, and which measures will we look at?", "What feedback did we collect last semester that we have not acted on yet?"] },

    /* ---------------- REAL-WORLD LEARNING ---------------- */
    "real-world-learning/deeds": { title: "The DEEDS Model", label: "Area 1", sub: "Discover · Examine · Engineer · Do · Share",
      card: "A community-driven, project-based learning cycle that connects academic coursework to real issues scholars and their communities actually face.",
      intro: "Discover, Examine, Engineer, Do, Share: a five-phase, community-driven learning cycle developed by RevX that connects academic coursework to real challenges scholars and their communities actually face. DEEDS is the instructional backbone of Real-World Learning at HBCU Early College Prep.",
      about: { t: "About DEEDS", d: "The DEEDS framework was developed by RevX, a national K-12 learning model equalizing access to social justice-focused, identity-affirming, real-world learning. RevX weaves literacy, numeracy, professional skills, and personal development into a five-phase learning journey. HBCU Early College Prep implements DEEDS as the core instructional model for its Leadership Studios and project-based learning experiences.", link: "https://revxedu.org", linkText: "Learn more about RevX" },
      slotId: "pb-deeds", slotDesc: "A DEEDS module from Discover through Share: how scholars move from identifying a community challenge to presenting solutions to a real audience, with teacher narration on each phase.",
      cycle: true,
      strong: ["Scholars co-define or deeply connect to the community challenge in Discover, not handed a topic", "Examine is the academic backbone: literacy and numeracy are integrated, not separated from the project", "Expert partners are embedded in Engineer: scholars collaborate with real professionals, not just observe them", "Do produces something real: a launched solution, collected data, measured impact", "Share is a genuine community event with real audience feedback, not a classroom presentation", "All five phases are explicitly connected to academic standards and personal development goals"],
      breakdowns: ["DEEDS treated as a project assignment rather than a full instructional cycle", "Community challenges chosen by teachers rather than co-defined with scholars", "The Share phase skipped or made perfunctory, losing the accountability and pride it creates", "Teachers asked to build modules from scratch while learning a new pedagogy at the same time", "DEEDS runs parallel to academic instruction rather than being woven through it", "Expert partners brought into Engineer without orientation to the DEEDS model"],
      learned: ["When scholars choose or co-define the community challenge, their investment in every subsequent phase increases dramatically.", "The Do phase is when the learning becomes real. Scholars who implement actual solutions report deeper confidence and ownership than those who only design them.", "Share creates a form of public accountability that classroom assessments cannot replicate. It is the phase that completes the identity shift.", "Building the first module for teachers before the year begins, then teaching them to build the second, is the most sustainable capacity-building approach."],
      relatedLessons: ["deeds-infrastructure", "real-stakes", "scaffold-for-access", "running-start", "internal-champions"],
      reflect: ["Are scholars discovering the challenge with genuine conviction, or receiving a topic to complete?", "Is Examine building real academic skills, or is it being rushed to get to the “project” part?", "Does the Share phase create real public accountability, or is it a formality?", "How is DEEDS woven through academic instruction, not running alongside it?"] },

    "real-world-learning/xq": { title: "XQ Competencies", label: "Area 2", sub: "Literacies · Knowledge · Thinking · Collaboration · Lifelong Learning",
      card: "XQ’s research-backed framework of 37 competencies, organized under five Learner Outcomes, that define what scholars should know and be able to do for college, career, and life.",
      intro: "XQ’s research-backed framework of 37 competencies, organized under five Learner Outcomes, that define what scholars should know and be able to do for college, career, and life. At HBCU Early College Prep, the XQ Competencies are the measuring stick for whether real-world learning is producing real growth.",
      about: { t: "About the XQ Competencies", d: "Developed by XQ Institute, the framework translates the five XQ Learner Outcomes into 37 specific, attainable goals. Used alongside academic standards, they work in any school or outside-of-school setting, accessible to teachers, scholars, families, and community partners alike.", link: "https://xqcompetencies.xqsuperschool.org/", linkText: "Explore the XQ Competency Navigator" },
      slotId: "pb-xq", slotDesc: "Scholars naming and demonstrating specific XQ competencies during a DEEDS Share presentation, showing that mastery is visible, not just assessed on paper.",
      outcomes: [
        { t: "Masters of All Fundamental Literacies", sub: "Reading · Writing · Math · Data · Visual Thinking", d: "Critical readers and compelling writers. Mathematical, numeric, data, and visual thinkers building the academic core for college, career, and life.", via: ["Scholars analyze real data sets in Discover and Examine", "Scholars write professional briefs and proposals in Engineer", "Scholars present findings with data evidence in Share"] },
        { t: "Holders of Foundational Knowledge", sub: "History · Culture · Science · Civic Engagement", d: "Curious people knowledgeable about the world: its history, culture, sciences, and civic life. Engaged participants in creating a more just democracy.", via: ["Community challenges in Discover connect to historical and civic context", "Examine builds content knowledge alongside literacy skills", "HBCU faculty ground academic content in Black history and cultural heritage"] },
        { t: "Original Thinkers for an Uncertain World", sub: "Sense-Making · Generative Thinking · Creative Problem-Solving", d: "Sense-makers dealing with conflicting knowledge. Generative and creative thinkers who reframe problems and create solutions in ambiguous real-world situations.", via: ["Engineer requires scholars to design and defend multiple solution approaches", "Do tests whether solutions actually work, requiring real adaptation", "Expert partners present messy, unresolved problems without known answers"] },
        { t: "Generous Collaborators", sub: "Self-Awareness · Talent-Seeking · Co-Creation · World Citizenship", d: "Self-aware team members who contribute their strengths, find the expertise of others, and seek out diverse perspectives as essential co-creators.", via: ["Team-based DEEDS projects require scholars to leverage each other’s strengths", "Engineer pairs scholars with professionals in genuine collaborative work", "Share invites real audience feedback scholars must listen to and respond to"] },
        { t: "Learners for Life", sub: "Self-Direction · Curiosity · Learning Path Invention", d: "Self-driven and self-directed. Curious about themselves and the world. Inventors of their own learning paths, careers, and lives.", via: ["Discover asks scholars to connect the challenge to their own lives and passions", "Personal goal-setting and reflection are built into every phase", "Expert partners share non-linear journeys, expanding scholars’ sense of what is possible"] }
      ],

.mnav a{display:block;padding:16px var(--gut);min-height:56px;font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--navy);border-bottom:1px solid var(--line)}

.mnav .btn{margin:16px var(--gut);width:calc(100% - 32px)}
@media(min-width:1040px){.nav{display:flex;gap:4px}.hdr .visit{display:inline-flex}.menu-btn{display:none}.mnav{display:none!important}}

/* Band of house colors */
.band{display:flex;height:10px}
.band i{flex:1}
.band i:nth-child(1){background:var(--navy)}.band i:nth-child(2){background:var(--scarlet)}.band i:nth-child(3){background:var(--keppel)}.band i:nth-child(4){background:var(--sky)}.band i:nth-child(5){background:var(--gold);flex:.35}

/* Layout blocks */
section{padding:48px 0}
@media(min-width:800px){section{padding:72px 0}}
.navy{background:var(--navy);color:#fff}
.navy h1,.navy h2,.navy h3,.navy h4{color:#fff}
.navy p{color:#fff}
.navy a:not(.btn){color:#fff}
.navy .muted{color:var(--sky)}
.wash{background:var(--wash)}
.skyb{background:var(--sky)}
.grid{display:grid;gap:16px}
@media(min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:640px) and (max-width:959px){.g4{grid-template-columns:repeat(2,1fr)}}
.rule{border:0;border-top:4px solid var(--navy);margin:32px 0}

/* Breadcrumbs */
.crumbs{padding:14px 0;font-size:.92rem;border-bottom:1px solid var(--line);background:var(--wash)}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 0}
.crumbs li{display:flex;align-items:center}
.crumbs li+li:before{content:"/";margin:0 10px;color:var(--grey)}
.crumbs a{font-weight:700}
.crumbs [aria-current]{color:var(--grey)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:20px 0 0;min-height:44px;text-decoration:none}
.back:before{content:"";width:10px;height:10px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg)}
.page-head{padding-top:32px;padding-bottom:8px}
[tabindex="-1"]:focus{outline:none;box-shadow:none}

/* Cards (sharp, block-lined) */
.card{display:block;background:#fff;border:2px solid var(--navy);border-top-width:10px;padding:20px;color:var(--ink);text-decoration:none;position:relative}
a.card:hover{background:var(--wash);color:var(--ink)}
a.card:hover .card-cta{text-decoration:underline}
.card.t-scarlet{border-top-color:var(--scarlet)}.card.t-keppel{border-top-color:var(--keppel)}.card.t-sky{border-top-color:var(--sky)}.card.t-gold{border-top-color:var(--gold)}
.card h3,.card h4{margin-bottom:.3em}
.card p{margin-bottom:.6em}
.card-cta{font-weight:700;color:var(--navy);display:inline-block;margin-top:4px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--navy);color:var(--navy);background:#fff;margin:0 6px 6px 0}
.tag.fill{background:var(--navy);color:#fff}
.tag.k{background:var(--keppel);border-color:var(--keppel);color:var(--ink)}
.tag.s{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.tag.g{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tag.r{background:var(--scarlet);border-color:var(--scarlet);color:var(--ink)}
.ph{background:#FFF6C2;border:2px dashed var(--ink);padding:1px 6px;font-weight:700;font-size:.92em}

/* Hero */
.hero{padding:40px 0 0}
.hero h1{color:#fff;margin-bottom:.15em}
.hero .lede{color:#fff}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 32px}
.hero .vwrap{border:4px solid var(--gold);border-bottom:0}

/* Proof strip */
.proof{display:grid;grid-template-columns:repeat(2,1fr);border-top:4px solid var(--navy);border-left:4px solid var(--navy)}
@media(min-width:900px){.proof{grid-template-columns:repeat(4,1fr)}}
.proof div{border-right:4px solid var(--navy);border-bottom:4px solid var(--navy);padding:20px 16px;background:#fff}
.proof b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,4rem);line-height:.9;color:var(--navy);border-bottom:6px solid var(--gold);display:inline-block;margin-bottom:10px}
.proof span{display:block;font-weight:700}
.foot{font-size:.9rem;color:var(--grey);margin-top:12px}

/* I am a */
.iam{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.iam{grid-template-columns:repeat(6,1fr)}}
.iam a{display:flex;flex-direction:column;justify-content:space-between;min-height:110px;padding:14px;border:3px solid var(--navy);text-decoration:none;background:#fff;color:var(--navy)}
.iam a b{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:.95}
.iam a span{font-weight:700;font-size:.9rem;color:var(--ink)}
.iam a:hover{background:var(--navy);color:#fff}.iam a:hover span{color:#fff}

/* Doors */
.doors{display:grid;gap:0}
@media(min-width:800px){.doors{grid-template-columns:repeat(3,1fr)}}
.door{display:block;padding:28px 24px 32px;text-decoration:none;min-height:220px}
.door b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(3rem,8vw,4.6rem);line-height:.85}
.door em{display:block;font-style:normal;font-weight:700;font-size:1.1rem;margin:6px 0 12px}
.door p{margin:0 0 12px}
.door .go{font-weight:700;text-decoration:underline}
.door.n{background:var(--navy);color:#fff}.door.n b{color:#fff}
.door.r{background:var(--scarlet);color:var(--ink)}
.door.k{background:var(--keppel);color:var(--ink)}.door.k b{color:var(--navy)}
.door:hover .go{text-decoration-thickness:4px}

/* Quote carousel */
.carousel{border:4px solid var(--navy);background:#fff}
.slides{position:relative}
.slide{display:none;padding:24px}
.slide.on{display:grid;gap:24px}
@media(min-width:900px){.slide.on{grid-template-columns:1.2fr 1fr;align-items:center;padding:36px}}
.q{margin:0}
.q .mark{display:block;width:56px;height:10px;background:var(--scarlet);margin-bottom:16px}
.q blockquote{margin:0;color:var(--navy)}
.q blockquote.d{font-size:clamp(2.6rem,7vw,4.6rem)}
.q blockquote.long{font-size:clamp(1.3rem,3vw,1.8rem)}
.q figcaption{margin-top:14px;font-weight:700}
.q figcaption span{display:block;font-weight:400;color:var(--grey)}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:4px solid var(--navy);padding:10px 12px;background:var(--wash);flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:44px;height:44px;border:3px solid var(--navy);background:#fff;cursor:pointer;font-weight:700;color:var(--navy)}
.dots button[aria-current="true"]{background:var(--navy);color:#fff}
.arrows{display:flex;gap:8px}

/* Featured lesson */
.feature{display:grid;gap:0;border:4px solid var(--navy)}
@media(min-width:800px){.feature{grid-template-columns:220px 1fr}}
.feature .num{background:var(--navy);color:#fff;font-family:var(--display);font-size:6rem;line-height:1;padding:20px;display:flex;align-items:flex-end}
.feature .body{padding:24px}

/* Where next */
.next{background:var(--navy);color:#fff;padding:40px 0}
.next h2{color:#fff}
.next .links{display:grid;gap:0;border:3px solid #fff}
@media(min-width:800px){.next .links{grid-template-columns:repeat(3,1fr)}}
.next a{display:block;padding:20px;color:#fff;text-decoration:none;border-bottom:3px solid #fff;min-height:96px}
@media(min-width:800px){.next a{border-bottom:0;border-right:3px solid #fff}.next a:last-child{border-right:0}}
.next a:last-child{border-bottom:0}
.next a b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.next a span{color:var(--sky)}
.next a:hover{background:var(--navy-deep)}
.next a:hover b{text-decoration:underline;text-decoration-color:var(--gold)}

/* VideoSlot */
.vslot{container-type:inline-size;margin:0 0 8px}
.vframe{position:relative;aspect-ratio:16/9;background:var(--sky);border:3px solid var(--navy);overflow:hidden}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:var(--ink)}
.vph .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vph .soon{background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px}
.vph .prod{background:#fff;color:var(--ink);font-weight:700;font-size:.74rem;padding:4px 8px;border:2px solid var(--navy);text-align:right}
.vph .play{align-self:center;width:64px;height:64px;border:4px solid var(--navy);display:flex;align-items:center;justify-content:center;background:#fff}
.vph .play:after{content:"";border-left:22px solid var(--navy);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.vph .meta b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;color:var(--navy)}
.vph .meta span{display:block;font-size:.88rem;font-weight:700}
.vph .meta .need{font-weight:400;font-size:.88rem;margin-top:4px;max-width:60ch}
@container (max-width:420px){.vph{padding:10px}.vph .play{width:44px;height:44px;border-width:3px}.vph .play:after{border-left-width:15px;border-top-width:10px;border-bottom-width:10px}.vph .meta b{font-size:1.25rem}.vph .meta .need,.vph .prod{display:none}.vph .meta span{font-size:.8rem}}
@container (min-width:760px){.vph{padding:24px}.vph .play{width:96px;height:96px}.vph .play:after{border-left-width:32px;border-top-width:20px;border-bottom-width:20px}.vph .meta b{font-size:2.6rem}}
.vctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.vctl button{min-height:44px;padding:6px 12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-family:var(--sans);font-size:.9rem;cursor:pointer}
.vctl button[aria-pressed="true"],.vctl button[aria-expanded="true"]{background:var(--navy);color:#fff}
.vctl .watchlink{font-weight:700;font-size:.9rem;margin-left:auto;min-height:44px;display:inline-flex;align-items:center}
.vcap{font-size:.92rem;color:var(--grey);margin-top:6px}
.navy .vcap{color:var(--sky)}
.vtx{border:2px solid var(--navy);border-top:0;padding:14px;background:#fff;color:var(--ink);font-size:.95rem;max-height:320px;overflow:auto}
.vtx p{color:var(--ink)}
.also{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.92rem}
.also a{font-weight:700;border:2px solid currentColor;padding:6px 10px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.vlabel{font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;color:var(--grey)}
.vref{border:3px solid var(--navy);border-left-width:12px;padding:14px;background:var(--wash)}
.vref b{display:block;color:var(--navy)}
.navy .vref{color:var(--ink)}

/* PhotoSlot */
.pslot{aspect-ratio:4/3;border:3px dashed var(--navy);background:var(--wash);display:flex;align-items:flex-end;padding:12px}
.pslot span{background:#fff;border:2px solid var(--navy);padding:4px 8px;font-weight:700;font-size:.88rem;color:var(--ink)}

/* Watch */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px;border:3px solid var(--navy);background:var(--wash);margin:16px 0 24px}
.filters label{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;gap:4px;min-width:180px;flex:1}
select,input,textarea{font:inherit;font-size:1rem;min-height:48px;padding:10px 12px;border:2px solid var(--navy);border-radius:0;background:#fff;color:var(--ink);width:100%}
textarea{min-height:120px}
.count{font-weight:700;color:var(--grey);margin:0 0 8px}
.vcard{border:2px solid var(--navy);background:#fff;display:flex;flex-direction:column}
.vcard .thumb{aspect-ratio:16/9;background:var(--sky);position:relative;display:block;border-bottom:3px solid var(--navy)}
.vcard .thumb:after{content:"";position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border:3px solid var(--navy);background:#fff}
.vcard .thumb:before{content:"";position:absolute;left:50%;top:50%;z-index:1;margin:-12px 0 0 -6px;border-left:20px solid var(--navy);border-top:12px solid transparent;border-bottom:12px solid transparent}
.vcard .thumb img{width:100%;height:100%;object-fit:cover}
.vcard .thumb .len{position:absolute;right:8px;bottom:8px;background:var(--navy);color:#fff;font-weight:700;font-size:.8rem;padding:2px 6px;z-index:2}
.vcard .in{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.vcard h3{font-size:1.7rem;margin:0}
.vcard h3 a{text-decoration:none}
.vcard h3 a:hover{text-decoration:underline}
.vcard .who{font-weight:700}
.vcard .role{font-size:.9rem;color:var(--grey)}
.vcard .rel{margin-top:auto;padding-top:8px;font-size:.92rem}
.series-head{display:flex;align-items:baseline;gap:12px;border-bottom:4px solid var(--navy);margin:40px 0 16px;padding-bottom:6px}
.series-head h2{margin:0}

/* Lists */
.blocklist{list-style:none;margin:0;padding:0}
.blocklist li{padding:12px 0 12px 22px;border-bottom:1px solid var(--line);position:relative}
.blocklist li:before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;background:var(--navy)}
.blocklist.r li:before{background:var(--scarlet)}
.blocklist.k li:before{background:var(--keppel)}
.blocklist.g li:before{background:var(--gold);outline:1px solid var(--ink)}
.pattern{display:grid;gap:24px}
@media(min-width:900px){.pattern{grid-template-columns:1fr 1fr}}
.pblock{border-top:8px solid var(--navy);padding-top:12px}
.pblock.r{border-top-color:var(--scarlet)}.pblock.k{border-top-color:var(--keppel)}.pblock.g{border-top-color:var(--gold)}
.pblock h2{font-size:2.2rem}
.reflect{background:var(--sky);padding:24px;border-left:12px solid var(--navy)}
.reflect h2{color:var(--navy)}
.reflect ol{margin:0;padding-left:1.4em}
.reflect li{margin:0 0 10px;font-weight:700}
.lessonlinks{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.lessonlinks a{font-weight:700}
.pending{border:2px dashed var(--ink);background:#FFF6C2;padding:10px 12px;font-size:.92rem}

/* Lesson detail */
.lhead{display:grid;gap:16px;align-items:end}
@media(min-width:800px){.lhead{grid-template-columns:auto 1fr}}
.lnum{font-family:var(--display);font-size:clamp(6rem,16vw,10rem);line-height:.8;color:var(--scarlet)}
.lsec{border-top:4px solid var(--navy);padding-top:14px;margin-top:28px}
.lsec h2{font-size:2rem}
.ltext{font-size:1.15rem}
.lnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.lcard .n{font-family:var(--display);font-size:3rem;line-height:.8;color:var(--scarlet)}

/* Still learning */
.still{counter-reset:s;display:grid;gap:0;border:3px solid #fff}
@media(min-width:800px){.still{grid-template-columns:1fr 1fr}}
.still div{padding:20px;border-bottom:3px solid #fff}
@media(min-width:800px){.still div:nth-child(odd){border-right:3px solid #fff}}
.still b{display:block;font-weight:700;font-size:1.1rem;color:var(--gold)}

/* Playbook */
.tabs{display:flex;gap:0;border-bottom:4px solid var(--navy);margin:24px 0 0}
.tabs a{padding:12px 20px;font-weight:700;text-decoration:none;border:3px solid var(--navy);border-bottom:0;margin-right:-3px;min-height:48px;display:inline-flex;align-items:center;background:#fff}
.tabs a[aria-current="page"]{background:var(--navy);color:#fff}
.comp{display:flex;flex-direction:column}
.comp .num{font-family:var(--display);font-size:4rem;line-height:.8;color:var(--navy)}
.comp ul{margin:8px 0 12px;padding-left:1.1em}
.through{border:4px solid var(--navy);padding:24px;background:var(--gold)}
.through p{color:var(--ink)}
.through q{font-family:var(--sans);font-weight:700;font-size:1.3rem;color:var(--navy);quotes:none}
.about{border:3px solid var(--navy);padding:16px;background:var(--wash)}
.path-card .looks{font-size:.92rem}

/* DEEDS cycle */
.cycle-wrap{display:grid;gap:24px;align-items:start}
@media(min-width:900px){.cycle-wrap{grid-template-columns:minmax(300px,460px) 1fr}}
.cycle{position:relative;width:100%;max-width:460px;aspect-ratio:1;margin:0 auto}
.cycle svg{position:absolute;inset:0;width:100%;height:100%}
.cycle .center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(2rem,8vw,3.2rem);color:var(--navy);text-align:center;line-height:.9}
.cycle .center small{display:block;font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.12em;color:var(--grey)}
.cycle button{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;width:26%;padding:8px 4px;border:3px solid var(--navy);background:#fff;color:var(--navy);font-family:var(--display);font-size:clamp(1.15rem,4vw,1.7rem);cursor:pointer;line-height:1}
.cycle button span{display:block;font-family:var(--sans);font-weight:700;font-size:.68rem;color:var(--grey)}
.cycle button[aria-pressed="true"]{background:var(--navy);color:#fff}
.cycle button[aria-pressed="true"] span{color:var(--sky)}
.phase-panel{border:4px solid var(--navy);border-top-width:12px;padding:20px;background:#fff}

/* Forms */
.bpath{border:4px solid var(--navy);margin:0 0 32px}
.bpath .top{padding:24px;display:grid;gap:24px}
@media(min-width:900px){.bpath .top{grid-template-columns:1.1fr 1fr}}
.bpath .hd{background:var(--navy);color:#fff;padding:18px 24px}
.bpath .hd h2{color:#fff;margin:0}
.bpath .hd p{color:var(--sky);margin:4px 0 0;font-weight:700}
form.bf{display:grid;gap:14px;padding:24px;background:var(--wash);border-top:4px solid var(--navy)}
@media(min-width:800px){form.bf{grid-template-columns:1fr 1fr}.bf .full{grid-column:1/-1}}
.bf label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.bf .note{font-size:.9rem;color:var(--grey);font-weight:400}
.formmsg{grid-column:1/-1;border:3px solid var(--navy);background:#fff;padding:12px;font-weight:700}
.steps{counter-reset:st;list-style:none;margin:0;padding:0;display:grid;gap:0;border:3px solid var(--navy)}
@media(min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{padding:20px;border-bottom:3px solid var(--navy);counter-increment:st}
@media(min-width:800px){.steps li{border-bottom:0;border-right:3px solid var(--navy)}.steps li:last-child{border-right:0}}
.steps li:before{content:counter(st);display:block;font-family:var(--display);font-size:3rem;line-height:.9;color:var(--scarlet)}
.statement{border:4px solid var(--navy);border-left-width:16px;padding:24px;background:#fff}

/* Footer */
.site-footer{background:var(--navy-deep);color:#fff;padding:40px 0 24px}
.site-footer a{color:#fff;font-weight:700;text-decoration:none;display:inline-block;padding:6px 0}
.site-footer a:hover{text-decoration:underline;text-decoration-color:var(--gold)}
.fcols{display:grid;gap:24px}
@media(min-width:800px){.fcols{grid-template-columns:1.4fr repeat(5,1fr)}}
.fcols h3{color:var(--sky);font-family:var(--sans);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.fcols ul{list-style:none;margin:0;padding:0}
.partners{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 20px;align-items:stretch}
.partners a{background:#fff;padding:8px 14px;display:flex;align-items:center;min-height:76px}
.fline{border-top:3px solid var(--sky);padding-top:16px;color:var(--sky);font-weight:700}

.print-only{display:none}
@media print{
  .site-header,.site-footer,.next,.crumbs,.vslot,.no-print,.back,.lnav,.band{display:none!important}
  body{font-size:12pt;color:#000}
  .print-only{display:block}
  .reflect{background:#fff;border-left:6px solid #000}
  .reflect li{margin-bottom:60px}
  a{color:#000;text-decoration:none}
  section{padding:12px 0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.home-partners{margin:0}
.home-partners a{border:2px solid var(--line)}

/* Lesson case study */
.case{display:grid;gap:32px;margin-top:16px}
@media(min-width:960px){.case{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}.case-side{position:sticky;top:96px}}
.case-main p{max-width:68ch}
.lstate{background:var(--navy);color:#fff;padding:24px;border-left:16px solid var(--scarlet)}

  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  let uid = 0;

  /* ---------- seal (reused from the original site, recolored to brand) ---------- */
  /* Official logos (embedded so the site stays one file) */
  const LOGOS = { seal: "images/logo-seal.webp", uncf: "images/logo-uncf.webp", dsu: "images/logo-dsu.webp", transcend: "images/logo-transcend.webp", xq: "images/logo-xq.png" };

    { n: "XQ Institute", href: "https://xqsuperschool.org", svg: `<img src="${LOGOS.xq}" alt="XQ Institute" style="height:30px;width:auto">` },

  /* ---------- embeds ---------- */
  function embedSrc(url, captions) {
    if (!url) return "";
    let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0${captions ? "&cc_load_policy=1" : ""}`;
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return `https://player.vimeo.com/video/${m[1]}?dnt=1${captions ? "&texttrack=en" : ""}`;
    return url;
  }

  /* ---------- VideoSlot ---------- */
  // opts: { slotId, label, desc, kicker }
  function videoFrame(v, opts) {
    opts = opts || {};
    const key = "v" + (++uid);
    const title = v ? v.title : "Video to come";
    const hasEmbed = v && v.embedUrl;
    let inner;
    if (hasEmbed) {
      inner = `<iframe src="${esc(embedSrc(v.embedUrl, false))}" title="${esc(v.title + (v.speaker ? ", " + v.speaker : ""))}" loading="lazy" allow="fullscreen; picture-in-picture; encrypted-media" allowfullscreen data-url="${esc(v.embedUrl)}"></iframe>`;
    } else {
      const poster = v && v.posterUrl ? `<img class="poster" src="${esc(v.posterUrl)}" alt="Poster frame: ${esc(v.title)}">` : "";
      const prod = v ? v.production : (opts.label && /edited/i.test(opts.label) ? "To be edited from existing footage" : "To be recorded");
      inner = `${poster}<div class="vph" role="img" aria-label="Video coming soon: ${esc(title)}${v ? ", " + esc(v.speaker) : ""}">
        <div class="top"><span class="soon">Video coming soon</span><span class="prod">${esc(prod)}</span></div>
        <div class="play" aria-hidden="true"></div>
        <div class="meta">${v ? `<b>${phx(v.title)}</b><span>${phx(v.speaker)}${v.role ? ", " + phx(v.role) : ""}</span><span>${phx(v.duration || "")}</span>` : `<b>Unassigned slot</b>`}
          ${opts.label && !v ? `<span class="need">${phx(opts.label)}</span>` : ""}</div></div>`;
    }
    const tx = v && v.transcript ? `<p>${esc(v.transcript).replace(/\n+/g, "</p><p>")}</p>`
      : `<p><strong>Transcript to come.</strong> Paste the final transcript into this video's <code>transcript</code> field in the VIDEOS config.</p>${v && v.summary ? `<p><strong>What this video covers:</strong> ${phx(v.summary)}</p>` : ""}${opts.label && !v ? `<p><strong>What goes here:</strong> ${phx(opts.label)}</p>` : ""}`;
    return `<div class="vslot" ${opts.slotId ? `data-slot="${esc(opts.slotId)}"` : ""}>
      ${opts.kicker ? `<p class="vlabel">${phx(opts.kicker)}</p>` : ""}

        <button type="button" aria-pressed="false" data-cc="${key}" ${hasEmbed ? "" : 'data-ph="1"'}>Captions</button>

      <p class="vcap" id="${key}-ccnote" hidden>Captions will play with the video once it is added.</p>
      <div class="vtx" id="${key}-tx" hidden>${tx}</div>
      ${opts.desc ? `<p class="vcap">${phx(opts.desc)}</p>` : ""}

  }

  function slot(slotId, extra) {
    extra = extra || {};
    const p = PLACE[slotId];
    if (!p) return `<div class="pending">Missing placement: ${esc(slotId)}</div>`;
    const ids = (Array.isArray(p.videoId) ? p.videoId : (p.videoId ? [p.videoId] : [])).filter(id => VID[id]);
    const main = ids[0] ? VID[ids[0]] : null;
    const rest = ids.slice(1).map(id => VID[id]);

      html = `<div class="vref" data-slot="${esc(slotId)}">${extra.kicker ? `<p class="vlabel">${phx(extra.kicker)}</p>` : ""}<b>${phx(main.title)}: ${phx(main.speaker)}</b> This video plays above on this page. <a href="#/watch/${esc(main.id)}">Open the video page</a>.</div>`;
    } else {
      if (main) pageFull.add(main.id);
      html = videoFrame(main, { slotId, label: p.label, desc: extra.desc, kicker: extra.kicker });

    const notes = [];
    if (rest.length) notes.push(`<span>Also paired:</span>` + rest.map(v => `<a href="#/watch/${esc(v.id)}">${phx(v.speaker)}: ${phx(v.title)}</a>`).join(""));

    return html + (notes.length ? `<div class="also">${notes.join("")}</div>` : "") + clips;
  }

  function parseHash() {
    let h = location.hash.replace(/^#\/?/, "");

  }
